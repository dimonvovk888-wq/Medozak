name: Daily Homework Reminder
on:
  schedule:
    - cron: "0 20 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим запуска"
        required: true
        default: "evening"
        type: choice
        options:
          - evening
          - morning
      test_date:
        description: "Тестовая дата для evening (например, 25.11) — пусто = завтра"
        required: false
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Send reminder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_ID }}
          TEST_DATE: ${{ github.event.inputs.test_date }}
          BOT_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || (github.event.schedule == '0 20 * * *' && 'morning' || 'evening') }}
        run: python remind.py
